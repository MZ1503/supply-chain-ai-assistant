services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mzuser:mzpassword@postgres:5432/supplychain
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis

  frontend:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    command: ["streamlit", "run", "streamlit_app.py", "--server.port", "8501"]
    depends_on:
      - api

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: mzuser
      POSTGRES_PASSWORD: mzpassword
      POSTGRES_DB: supplychain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: